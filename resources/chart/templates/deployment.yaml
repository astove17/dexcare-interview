apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interview.fullname" . }}
  labels:
    {{- include "interview.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "interview.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        seccomp.security.alpha.kubernetes.io/pod: runtime/default
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "interview.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "interview.serviceAccountName" . }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: nginx:1.19.0
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8080
          protocol: TCP
        - name: http-ping
          containerPort: 7001
          protocol: TCP
        - containerPort: 18080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            - NET_RAW
          readOnlyRootFilesystem: false
        volumeMounts:
        - name: cache-volume
          mountPath: /var/cache/nginx
        - name: pid-volume
          mountPath: /var/run
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: config
          mountPath: /etc/nginx/templates/default.conf.template
          subPath: default.conf.template
        livenessProbe:
          httpGet:
            path: /ping
            port: http-ping
        readinessProbe:
          httpGet:
            path: /ping
            port: http-ping
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsGroup: 10014
        runAsNonRoot: true
        runAsUser: 10014
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: cache-volume
        emptyDir: {}
      - name: config
        configMap:
          name: {{ include "interview.fullname" . }}
      - name: pid-volume
        emptyDir: {}
